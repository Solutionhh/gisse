<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Un jardín para Gisse 🌷</title>

<style>
*,
*::after,
*::before {
  padding: 0;
  margin: 0;
  box-sizing: border-box;
}

:root {
  --dark-color: #000;
  --fl-speed: 0.8s;
  --speed-leaf: 2s;
}

body {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  min-height: 100vh;
  background-color: #000;
  overflow: hidden;
  perspective: 1000px;
  cursor: pointer;
}

/* =========================
   CIELO
========================= */

.night {
  position: fixed;
  left: 50%;
  top: 0;
  transform: translateX(-50%);
  width: 100%;
  height: 100%;
  filter: blur(0.1vmin);

  background-image:
    radial-gradient(
      ellipse at top,
      transparent 0%,
      #000
    ),
    radial-gradient(
      ellipse at bottom,
      #000,
      rgba(145, 233, 255, 0.2)
    ),
    repeating-linear-gradient(
      220deg,
      rgb(0, 0, 0) 0px,
      rgb(0, 0, 0) 19px,
      transparent 19px,
      transparent 22px
    ),
    repeating-linear-gradient(
      189deg,
      rgb(0, 0, 0) 0px,
      rgb(0, 0, 0) 19px,
      transparent 19px,
      transparent 22px
    ),
    repeating-linear-gradient(
      148deg,
      rgb(0, 0, 0) 0px,
      rgb(0, 0, 0) 19px,
      transparent 19px,
      transparent 22px
    ),
    linear-gradient(
      90deg,
      rgb(0, 255, 250),
      rgb(240, 240, 240)
    );

  z-index: 0;
}

/* =========================
   ESTRELLAS FUGACES
========================= */

.shooting-stars {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 1;
}

.shooting-star {
  position: absolute;
  width: 4px;
  height: 4px;
  background: #fff;
  border-radius: 50%;
  box-shadow:
    0 0 6px 2px rgba(255,255,255,0.8);
  opacity: 0;
  animation: shootingStar 3s linear infinite;
}

.shooting-star::before {
  content: '';
  position: absolute;
  top: 50%;
  right: 0;
  transform: translateY(-50%);
  width: 0;
  height: 2px;

  background: linear-gradient(
    90deg,
    rgba(255,255,255,0),
    rgba(255,255,255,1)
  );

  animation: shootingStarTail 3s linear infinite;
}

@keyframes shootingStar {
  0% {
    opacity: 0;
    transform:
      translateX(0)
      translateY(0)
      rotate(45deg);
  }

  10% {
    opacity: 1;
  }

  90% {
    opacity: 1;
  }

  100% {
    opacity: 0;
    transform:
      translateX(120vw)
      translateY(50vh)
      rotate(10deg);
  }
}

@keyframes shootingStarTail {
  0% {
    width: 0;
  }

  30% {
    width: 100px;
  }

  100% {
    width: 0;
  }
}

/* =========================
   PALABRAS DEL FONDO
========================= */

#palabras-fondo {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  overflow: hidden;
  z-index: 3;
}

.palabra {
  position: absolute;

  font-family:
    "Segoe UI",
    Arial,
    sans-serif;

  font-size: clamp(15px, 2.5vmin, 25px);
  font-weight: 600;
  letter-spacing: 0.5px;

  opacity: 0;

  white-space: nowrap;

  text-shadow:
    0 0 5px currentColor,
    0 0 10px currentColor;

  transform:
    translateY(10px)
    scale(0.8);

  transition:
    opacity 2s ease,
    transform 2s ease;

  user-select: none;
}

.palabra.visible {
  opacity: 0.75;

  transform:
    translateY(0)
    scale(1);
}

.palabra.fade-out {
  opacity: 0;
  transform:
    translateY(-15px)
    scale(1.1);
}

/* =========================
   LLUVIA DE TULIPANES
========================= */

.tulipan-lluvia {
  position: fixed;
  top: -12vh;

  z-index: 15;

  pointer-events: none;

  font-size: clamp(22px, 4vmin, 42px);

  animation:
    caerTulipan linear forwards;

  filter:
    drop-shadow(0 0 5px rgba(255,120,180,0.5));
}

@keyframes caerTulipan {

  0% {
    transform:
      translateY(-10vh)
      translateX(0)
      rotate(0deg);

    opacity: 0;
  }

  8% {
    opacity: 1;
  }

  50% {
    transform:
      translateY(55vh)
      translateX(30px)
      rotate(180deg);
  }

  100% {
    transform:
      translateY(115vh)
      translateX(-40px)
      rotate(360deg);

    opacity: 0;
  }
}

/* =========================
   EFECTOS AL HACER CLICK
========================= */

.click-tulipan {
  position: fixed;

  z-index: 100;

  pointer-events: none;

  font-size: clamp(25px, 5vmin, 48px);

  animation:
    explosionTulipan 1.8s ease-out forwards;

  filter:
    drop-shadow(0 0 8px rgba(255,150,200,0.8));
}

.click-corazon {
  position: fixed;

  z-index: 100;

  pointer-events: none;

  font-size: clamp(20px, 4vmin, 38px);

  animation:
    explosionCorazon 1.7s ease-out forwards;

  filter:
    drop-shadow(0 0 8px rgba(255,80,150,0.8));
}

@keyframes explosionTulipan {

  0% {
    opacity: 0;
    transform:
      translate(-50%, -50%)
      scale(0.2)
      rotate(0deg);
  }

  15% {
    opacity: 1;
  }

  100% {
    opacity: 0;

    transform:
      translate(
        calc(-50% + var(--x)),
        calc(-50% + var(--y))
      )
      scale(1)
      rotate(var(--rot));
  }
}

@keyframes explosionCorazon {

  0% {
    opacity: 0;
    transform:
      translate(-50%, -50%)
      scale(0.2);
  }

  15% {
    opacity: 1;
  }

  100% {
    opacity: 0;

    transform:
      translate(
        calc(-50% + var(--x)),
        calc(-50% + var(--y))
      )
      scale(1.2)
      rotate(var(--rot));
  }
}

/* =========================
   TEXTO PRINCIPAL
========================= */

.special-text {
  position: fixed;

  top: 5%;
  left: 50%;

  transform: translateX(-50%);

  width: min(90%, 700px);

  color: #FFD700;

  font-family:
    "Segoe UI",
    Arial,
    sans-serif;

  font-size: clamp(20px, 5vw, 36px);

  font-weight: bold;

  text-align: center;

  line-height: 1.25;

  text-shadow:
    0 0 5px #FFD700,
    0 0 10px #FFD700,
    0 0 15px #FFA500,
    0 0 25px #FF8C00;

  border: 2px solid #FFD700;

  border-radius: 15px;

  padding: 12px 18px;

  background:
    rgba(0,0,0,0.35);

  backdrop-filter: blur(3px);

  z-index: 20;

  opacity: 0;

  animation:
    fadeIn 3s 1s forwards;
}

@keyframes fadeIn {
  to {
    opacity: 1;
  }
}

/* =========================
   FLORES
========================= */

.flowers {
  position: relative;

  transform: scale(0.7);

  z-index: 2;
}

.flower {
  position: absolute;

  bottom: 15vmin;

  transform-origin: bottom center;

  z-index: 50;
}

.flower--1 {
  animation:
    moving-flower-1 4s linear infinite;
}

.flower--1 .flower__line {
  height: 70vmin;
  animation-delay: 0.3s;
}

.flower--1 .flower__line__leaf--1 {
  animation:
    blooming-leaf-right var(--fl-speed) 1.6s backwards;
}

.flower--1 .flower__line__leaf--2 {
  animation:
    blooming-leaf-right var(--fl-speed) 1.4s backwards;
}

.flower--1 .flower__line__leaf--3 {
  animation:
    blooming-leaf-left var(--fl-speed) 1.2s backwards;
}

.flower--1 .flower__line__leaf--4 {
  animation:
    blooming-leaf-left var(--fl-speed) 1s backwards;
}

.flower--2 {
  left: 50%;
  transform: rotate(20deg);

  animation:
    moving-flower-2 4s linear infinite;
}

.flower--2 .flower__line {
  height: 60vmin;
  animation-delay: 0.6s;
}

.flower--2 .flower__line__leaf--1 {
  animation:
    blooming-leaf-right var(--fl-speed) 1.9s backwards;
}

.flower--2 .flower__line__leaf--2 {
  animation:
    blooming-leaf-right var(--fl-speed) 1.7s backwards;
}

.flower--2 .flower__line__leaf--3 {
  animation:
    blooming-leaf-left var(--fl-speed) 1.5s backwards;
}

.flower--2 .flower__line__leaf--4 {
  animation:
    blooming-leaf-left var(--fl-speed) 1.3s backwards;
}

.flower--3 {
  left: 50%;

  transform: rotate(-15deg);

  animation:
    moving-flower-3 4s linear infinite;
}

.flower--3 .flower__line {
  animation-delay: 0.9s;
}

.flower--3 .flower__line__leaf--1 {
  animation:
    blooming-leaf-right var(--fl-speed) 2.5s backwards;
}

.flower--3 .flower__line__leaf--2 {
  animation:
    blooming-leaf-right var(--fl-speed) 2.3s backwards;
}

.flower--3 .flower__line__leaf--3 {
  animation:
    blooming-leaf-left var(--fl-speed) 2.1s backwards;
}

.flower--3 .flower__line__leaf--4 {
  animation:
    blooming-leaf-left var(--fl-speed) 1.9s backwards;
}

.flower--4 {
  left: -25%;

  z-index: -6;

  transform: rotate(10deg);

  animation:
    moving-flower-4 3.5s linear infinite;
}

.flower--4 .flower__line {
  height: 90vmin;
  animation-delay: 1.2s;
}

.flower--5 {
  left: 75%;

  z-index: -7;

  transform: rotate(-25deg);

  animation:
    moving-flower-5 4.5s linear infinite;
}

.flower--5 .flower__line {
  height: 85vmin;
  animation-delay: 1.9s;
}

/* =========================
   PÉTALOS
========================= */

.flower__leafs {
  position: relative;

  animation:
    blooming-flower 2s backwards;
}

.flower__leafs--1 {
  animation-delay: 1.1s;
}

.flower__leafs--2 {
  animation-delay: 1.4s;
}

.flower__leafs--3 {
  animation-delay: 1.7s;
}

.flower__leafs--4,
.flower__leafs--5 {
  animation-delay: 2s;
}

.flower__leafs::after {
  content: "";

  position: absolute;

  left: 0;
  top: 0;

  transform:
    translate(-50%, -100%);

  width: 8vmin;
  height: 8vmin;

  background-color: #6bf0ff;

  filter: blur(10vmin);
}

/* Pétalos amarillos originales */

.flower__leaf {
  position: absolute;

  bottom: 0;
  left: 50%;

  width: 23vmin;
  height: 6vmin;

  border-radius:
    60% 40% 60% 40%;

  background-color: #ffd700;

  background-image:
    linear-gradient(
      to top,
      #ff8c00,
      #ffd700,
      #ffff00
    );

  transform-origin: bottom center;

  opacity: 0.95;

  box-shadow:
    inset 0 0 1vmin rgba(255,255,255,0.7),
    0 0 3vmin rgba(255,215,0,0.4);

  z-index: 2;
}

.flower__white-circle {
  position: absolute;

  left: -4vmin;
  top: -4vmin;

  width: 10vmin;
  height: 10vmin;

  border-radius: 50%;

  background-color: #8b4513;

  background-image:
    radial-gradient(
      circle at 30% 30%,
      #654321,
      #8b4513,
      #2f1b14
    );

  box-shadow:
    inset 0 0 2vmin rgba(0,0,0,0.8),
    0 0 1vmin rgba(139,69,19,0.6);
}

.flower__white-circle::after {
  content: "";

  position: absolute;

  left: 46%;
  top: 31%;

  transform:
    translate(-50%, -50%);

  width: 80%;
  height: 80%;

  z-index: 3;

  border-radius: inherit;

  background-image:
    repeating-conic-gradient(
      from 0deg,
      #2f1b14 0deg 15deg,
      #654321 15deg 30deg
    ),
    radial-gradient(
      circle at center,
      #8b4513,
      #654321
    );
}

/* =========================
   TALLO
========================= */

.flower__line {
  height: 55vmin;

  width: 2vmin;

  background-image:
    linear-gradient(
      to left,
      rgb(0,0,0,0.3),
      transparent,
      rgba(255,255,255,0.2)
    ),
    linear-gradient(
      to top,
      transparent 10%,
      #2d5016,
      #4a7c23,
      #6b8e23
    );

  box-shadow:
    inset 0 0 2px rgba(0,0,0,0.7);

  animation:
    grow-flower-tree 4s backwards;
}

/* =========================
   HOJAS
========================= */

.flower__line__leaf {
  --w: 8vmin;
  --h: calc(var(--w) + 3vmin);

  position: absolute;

  top: 20%;
  left: 90%;

  width: var(--w);
  height: var(--h);

  border-top-right-radius: var(--h);
  border-bottom-left-radius: var(--h);

  background-image:
    linear-gradient(
      to top,
      rgba(45,80,22,0.6),
      #4a7c23,
      #6b8e23
    );

  box-shadow:
    inset 0 0 1vmin rgba(0,0,0,0.3);
}

.flower__line__leaf--1 {
  transform:
    rotate(70deg)
    rotateY(30deg);
}

.flower__line__leaf--2 {
  top: 45%;

  transform:
    rotate(70deg)
    rotateY(30deg);
}

.flower__line__leaf--3,
.flower__line__leaf--4 {
  border-top-right-radius: 0;
  border-bottom-left-radius: 0;

  border-top-left-radius: var(--h);
  border-bottom-right-radius: var(--h);

  left: -460%;
  top: 12%;

  transform:
    rotate(-70deg)
    rotateY(30deg);
}

.flower__line__leaf--4 {
  top: 40%;
}

/* =========================
   PASTO
========================= */

.flower__grass {
  --c: #4a7c23;
  --line-w: 2vmin;

  position: absolute;

  bottom: 12vmin;
  left: -7vmin;

  display: flex;

  flex-direction: column;

  align-items: flex-end;

  z-index: 20;

  transform-origin: bottom center;

  transform:
    rotate(-48deg)
    rotateY(40deg);
}

.flower__grass--1 {
  animation:
    moving-grass 2s linear infinite;
}

.flower__grass--2 {
  left: 2vmin;
  bottom: 10vmin;

  transform:
    scale(0.5)
    rotate(75deg)
    rotateX(10deg)
    rotateY(-200deg);

  opacity: 0.8;

  z-index: 0;
}

.flower__grass--3 {
  left: -25vmin;
  bottom: 8vmin;

  transform:
    scale(0.7)
    rotate(-30deg)
    rotateY(45deg);

  opacity: 0.9;
}

.flower__grass--4 {
  left: -35vmin;
  bottom: 15vmin;

  transform:
    scale(0.4)
    rotate(60deg)
    rotateX(15deg)
    rotateY(-180deg);

  opacity: 0.7;
}

.flower__grass--5 {
  left: -18vmin;
  bottom: 6vmin;

  transform:
    scale(0.6)
    rotate(-60deg)
    rotateY(60deg);

  opacity: 0.85;
}

.flower__grass--6 {
  left: 25vmin;
  bottom: 9vmin;

  transform:
    scale(0.65)
    rotate(35deg)
    rotateY(-45deg);

  opacity: 0.9;
}

.flower__grass--7 {
  left: 35vmin;
  bottom: 14vmin;

  transform:
    scale(0.45)
    rotate(-70deg)
    rotateX(20deg)
    rotateY(170deg);

  opacity: 0.75;
}

.flower__grass--8 {
  left: 18vmin;
  bottom: 5vmin;

  transform:
    scale(0.55)
    rotate(50deg)
    rotateY(-70deg);

  opacity: 0.8;
}

.flower__grass--9 {
  left: -45vmin;
  bottom: 20vmin;

  transform:
    scale(0.3)
    rotate(20deg)
    rotateY(90deg);

  opacity: 0.6;
}

.flower__grass--10 {
  left: 42vmin;
  bottom: 18vmin;

  transform:
    scale(0.35)
    rotate(-45deg)
    rotateY(-120deg);

  opacity: 0.65;
}

.flower__grass--top {
  width: 7vmin;
  height: 10vmin;

  border-top-right-radius: 100%;

  border-right:
    var(--line-w) solid var(--c);

  transform-origin: bottom center;

  transform: rotate(-2deg);
}

.flower__grass--bottom {
  margin-top: -2px;

  width: var(--line-w);
  height: 25vmin;

  background-image:
    linear-gradient(
      to top,
      transparent,
      var(--c)
    );
}

.flower__grass__leaf {
  --size: 10vmin;

  position: absolute;

  width: calc(var(--size) * 2.1);
  height: var(--size);

  border-top-left-radius: var(--size);
  border-top-right-radius: var(--size);

  background-image:
    linear-gradient(
      to top,
      transparent,
      transparent 30%,
      var(--c)
    );

  z-index: 100;
}

.flower__grass__overlay {
  position: absolute;

  top: -10%;
  right: 0%;

  width: 100%;
  height: 100%;

  background-color:
    rgba(0,0,0,0.6);

  filter: blur(1.5vmin);

  z-index: 100;
}

/* =========================
   ANIMACIONES FLORES
========================= */

@keyframes grow-flower-tree {

  0% {
    height: 0;
    border-radius: 1vmin;
  }
}

@keyframes blooming-flower {

  0% {
    transform: scale(0);
  }
}

@keyframes blooming-leaf-right {

  0% {
    transform-origin: left;

    transform:
      rotate(70deg)
      rotateY(30deg)
      scale(0);
  }
}

@keyframes blooming-leaf-left {

  0% {
    transform-origin: right;

    transform:
      rotate(-70deg)
      rotateY(30deg)
      scale(0);
  }
}

@keyframes moving-flower-1 {

  0%,100% {
    transform: rotate(2deg);
  }

  50% {
    transform: rotate(-2deg);
  }
}

@keyframes moving-flower-2 {

  0%,100% {
    transform: rotate(18deg);
  }

  50% {
    transform: rotate(14deg);
  }
}

@keyframes moving-flower-3 {

  0%,100% {
    transform: rotate(-18deg);
  }

  50% {
    transform:
      rotate(-20deg)
      rotateY(-10deg);
  }
}

@keyframes moving-flower-4 {

  0%,100% {
    transform: rotate(9deg);
  }

  50% {
    transform:
      rotate(12deg)
      rotateY(9deg);
  }
}

@keyframes moving-flower-5 {

  0%,100% {
    transform: rotate(-5deg);
  }

  50% {
    transform:
      rotate(-11deg)
      rotateY(5deg);
  }
}

@keyframes moving-grass {

  0%,100% {
    transform:
      rotate(-48deg)
      rotateY(40deg);
  }

  50% {
    transform:
      rotate(-50deg)
      rotateY(40deg);
  }
}

.grow-ans {
  animation:
    grow-ans 2s var(--d) backwards;
}

.growing-grass {
  animation:
    growing-grass-ans 1s 2s backwards;
}

@keyframes grow-ans {

  0% {
    transform: scale(0);
    opacity: 0;
  }
}

@keyframes growing-grass-ans {

  0% {
    transform: scale(0);
  }
}

.not-loaded * {
  animation-play-state: paused !important;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 600px) {

  .special-text {
    width: 92%;
    top: 4%;

    font-size: 21px;

    padding:
      10px 12px;
  }

  .palabra {
    font-size: 14px;
  }
}
</style>
</head>

function crearPalabra() {

  const palabraElem =

  palabraElem.className = "palabra";

  palabraElem.textContent =
    palabras[
      Math.floor(
        Math.random() * palabras.length

    ];

  const cont =
    document.getElementById(
      "palabras-fondo"
    );

  const x =

    );

      cont.clientHeight - 80
    );

  palabraElem.style.left =
    x + "px";

  palabraElem.style.top =
    y + "px";

  palabraElem.style.fontSize =
    (15 + Math.random() * 10) +
    "px";

  cont.appendChild(
    palabraElem
  );

  requestAnimationFrame(() => {

    palabraElem.classList.add(
      "visible"
    );

  });

  setTimeout(() => {

    palabraElem.classList.remove(
      "visible"
    );

    palabraElem.classList.add(
      "fade-out"
    );

/* =====================================================
   EXPLOSIÓN AL HACER CLICK
===================================================== */

function crearTulipanesAlClick(
  x,
  y
) {

  const cantidad = 16;

  for (
    let i = 0;
    i < cantidad;
    i++
  ) {

    const elem =
      document.createElement(
        "span"
      );

    elem.className =
      "click-tulipan";

    elem.textContent =
      "🌷";

    const angulo =
      Math.random() *
      Math.PI * 2;

    const distancia =
      60 +
      Math.random() * 130;

    const desplazamientoX =
      Math.cos(angulo) *
      distancia;

    const desplazamientoY =
      Math.sin(angulo) *
      distancia;

    elem.style.left =
      x + "px";

    elem.style.top =
      y + "px";

    elem.style.setProperty(
      "--x",
      desplazamientoX + "px"
    );

    elem.style.setProperty(
      "--y",
      desplazamientoY + "px"
    );

    elem.style.setProperty(
      "--rot",
      (Math.random() * 720 - 360) +
      "deg"
    );

    elem.style.animationDelay =
      Math.random() * 0.15 +
      "s";

    document.body.appendChild(
      elem
    );

    setTimeout(() => {

      elem.remove();

    }, 2200);
  }


  /* Corazones */

  for (
    let i = 0;
    i < 8;
    i++
  ) {

    const corazon =
      document.createElement(
        "span"
      );

    corazon.className =
      "click-corazon";

    corazon.textContent =
      Math.random() > 0.5
        ? "❤️"
        : "💗";

    const angulo =
      Math.random() *
      Math.PI * 2;

    const distancia =
      50 +
      Math.random() * 100;

    corazon.style.left =
      x + "px";

    corazon.style.top =
      y + "px";

    corazon.style.setProperty(
      "--x",
      Math.cos(angulo) *
      distancia +
      "px"
    );

    corazon.style.setProperty(
      "--y",
      Math.sin(angulo) *
      distancia +
      "px"
    );

    corazon.style.setProperty(
      "--rot",
      (Math.random() * 360 - 180) +
      "deg"
    );

    document.body.appendChild(
      corazon
    );

    setTimeout(() => {

      corazon.remove();

    }, 2100);
  }
}
